[package]
name = "chronon-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Scheduler tick loop and due-job queries for Chronon"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
chronon-core = { workspace = true }
chronon-telemetry = { workspace = true }
croner = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
xxhash-rust = { workspace = true }

# Keep wasm hydrate graphs free of tokio's full default/rt-multi-thread feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }

[dev-dependencies]
chronon-backend-mem = { workspace = true }
